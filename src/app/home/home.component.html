<section>
  <div class="heading"><div><h1>Users</h1><p>Browse and edit directory entries.</p></div><input type="search" aria-label="Filter users" placeholder="Filter users" [ngModel]="query()" (ngModelChange)="query.set($event)" /></div>
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Address</th></tr></thead><tbody>
    @for (user of filteredUsers(); track user.id) { <tr><td><a [routerLink]="['/details', user.id]">{{ user.id }}</a></td><td>{{ user.name }}</td><td>{{ user.email }}</td><td>{{ user.address }}</td></tr> }
    @empty { <tr><td colspan="4">No users found.</td></tr> }
  </tbody></table></div>
</section>
