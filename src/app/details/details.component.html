<section>
  <a routerLink="/">← Back to users</a>
  @if (user(); as current) {
    <h1>User details</h1><form (ngSubmit)="save()"><label>Name<input name="name" [(ngModel)]="current.name" required /></label><label>Email<input name="email" type="email" [(ngModel)]="current.email" /></label><label>Address<input name="address" [(ngModel)]="current.address" /></label><button type="submit">Save</button>@if (saved()) { <span role="status">Saved locally.</span> }</form>
  } @else { <p>User not found.</p> }
</section>
